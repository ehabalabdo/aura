
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FitFusion AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Inter:wght@300;400;500;600&family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        /* Base styles */
        body {
            font-family: 'Inter', sans-serif;
            background-color: #fafafa;
            line-height: 1.5;
        }
        
        /* Global Arabic Overrides */
        [dir="rtl"], 
        [dir="rtl"] body, 
        [dir="rtl"] button, 
        [dir="rtl"] input, 
        [dir="rtl"] textarea, 
        [dir="rtl"] select,
        [dir="rtl"] * {
            font-family: 'Cairo', sans-serif !important;
            /* Arabic letters must connect. letter-spacing breaks them. */
            letter-spacing: 0 !important;
            word-spacing: normal !important;
            text-rendering: optimizeLegibility !important;
            -webkit-font-smoothing: antialiased;
            /* Increase line height for Arabic to prevent overlapping diacritics/tall letters */
            line-height: 1.6 !important;
        }

        /* Titles Styling */
        h1, h2, h3, .font-display {
            font-family: 'Cormorant Garamond', serif;
            line-height: 1.2;
        }

        /* In RTL mode, titles should also use Cairo and NO spacing */
        [dir="rtl"] h1, 
        [dir="rtl"] h2, 
        [dir="rtl"] h3, 
        [dir="rtl"] .font-display {
            font-family: 'Cairo', sans-serif !important;
            font-weight: 700;
            letter-spacing: 0 !important;
            /* Special line height for Arabic display titles */
            line-height: 1.4 !important;
        }

        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #fafafa;
        }
        ::-webkit-scrollbar-thumb {
            background: #e5e7eb;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #d1d5db;
        }

        /* Smooth transitions for language switching */
        * {
            transition: font-family 0.1s ease, line-height 0.1s ease;
        }
    </style>
<script type="importmap">
{
  "imports": {
    "@google/genai": "https://esm.sh/@google/genai@^1.35.0",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "react/": "https://esm.sh/react@^19.2.3/"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>

<script type="module" src="/index.tsx"></script>
</body>
</html>
